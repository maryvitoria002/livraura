<h1>Usuários</h1>
<a href="{% url 'usuario_criar' %}">Criar Usuário</a>
<ul>
    {% for usuario in usuarios %}
        <li>{{ usuario.username }} - {{ usuario.email }} - 
            <a href="{% url 'usuario_editar' usuario.id %}">Editar</a> 
            <a href="{% url 'usuario_deletar' usuario.id %}">Deletar</a>
            <a href="{% url 'usuario_detalhar' usuario.id %}">Ver</a>
        </li>  
    {% endfor %}
</ul>
