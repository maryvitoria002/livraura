{% extends "base.html" %}
{% block title %}Novo autor{% endblock %}
{% block content %}
<div class="app-heading"><span class="title">ACERVO</span><h1>Cadastrar autor</h1><p>Adicione um novo autor ao catálogo.</p></div>
<div class="app-panel"><form method="POST" class="app-form">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-dark">Cadastrar autor</button> <a href="{% url 'autor_listar' %}" class="btn btn-outline-dark">Voltar</a></form></div>
{% endblock %}
