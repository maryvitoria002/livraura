<h1>Livros</h1>
<a href="{% url 'livro_criar' %}">Cadastrar Livro</a>
<ul>
    {% for livro in livros %}
        <li>{{ livro.titulo }} - {{ livro.editora }} - 
            <a href="{% url 'livro_editar' livro.id %}">Editar</a> 
            <a href="{% url 'livro_excluir' livro.id %}">Deletar</a>
            <a href="{% url 'livro_ver' livro.id %}">Ver</a>
        </li>  
    {% endfor %}
</ul>
